<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f8cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英単語">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>英単語マスター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>英単語マスター</h1>
      <div class="tabs" role="tablist" aria-label="出題範囲">
        <button class="tab" data-mode="all" role="tab">すべて</button>
        <button class="tab" data-mode="word" role="tab">英単語</button>
        <button class="tab" data-mode="idiom" role="tab">熟語</button>
        <button class="tab" data-mode="review" role="tab">復習</button>
      </div>
      <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
      <div class="stats"><span id="pos"></span><span id="score"></span></div>
    </header>

    <section class="card" id="quiz">
      <span class="badge" id="badge"></span>
      <div class="question" id="question"></div>
      <button class="speak" id="speak" aria-label="発音を聞く">🔊</button>
      <ul class="choices" id="choices"></ul>
      <p class="example" id="example" aria-live="polite"></p>
    </section>

    <section class="card done" id="done" hidden>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <button class="primary" id="restart">もう一度</button>
      <button class="primary alt" id="goReview" hidden>復習する</button>
    </section>

    <footer><button class="link" id="reset">進捗をリセット</button></footer>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
